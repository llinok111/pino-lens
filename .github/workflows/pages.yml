name: pages

# Builds the demo report from the sample dataset with the zero-dependency CLI
# and publishes it to GitHub Pages. The report is generated here rather than
# committed twice: the data and the pre-built copy already live in lens/.

on:
  push:
    branches: [main]
    paths:
      - 'lens/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the demo report
        run: |
          mkdir -p _site
          node lens/bin/pino-lens.js build \
            lens/examples/traffic-service/data/traffic.ndjson \
            --title "pino-lens · traffic-service sample" \
            --levels notice=35 \
            -o _site/index.html
          touch _site/.nojekyll
          ls -lh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
